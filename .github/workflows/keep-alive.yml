name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          RENDER_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set yet. Skipping ping."
            exit 0
          fi
          echo "Pinging $RENDER_URL/health ..."
          curl -s -f "$RENDER_URL/health" || echo "Ping attempt completed"
